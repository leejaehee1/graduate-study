<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .t { fill: #1f2937; font-size: 15px; }
      .lbl { fill: #1e3a8a; font-size: 17px; font-weight: 700; }
      .note { fill: #6b7280; font-size: 13px; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; fill: #1f2937; font-size: 14px; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .row { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .hi { fill: #4338ca; stroke: #4338ca; }
      .hit { fill: #ffffff; font-weight: 700; }
      .flow { stroke: #0f766e; stroke-width: 2.4; fill: none; }
      .num { fill: #1e3a8a; }
      .numt { fill: #ffffff; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="880" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="60" y="58" class="note" font-size="15">챕터 3 정리</text>
  <text x="60" y="100" fill="#111827" font-size="34" font-weight="700">텍스트에서 입력 임베딩까지</text>
  <line x1="60" y1="124" x2="1540" y2="124" stroke="#1e3a8a" stroke-width="3"/>

  <!-- ① 텍스트 -->
  <circle cx="72" cy="170" r="12" class="num"/><text x="72" y="175" text-anchor="middle" class="numt">1</text>
  <text x="92" y="176" class="lbl">텍스트</text>
  <rect x="60" y="190" width="340" height="46" rx="8" class="row"/>
  <text x="230" y="219" text-anchor="middle" class="mono">I HAD always thought Jack …</text>
  <line x1="230" y1="236" x2="230" y2="276" class="flow" marker-end="url(#arr)"/>
  <text x="244" y="261" class="note">BPE 인코드</text>

  <!-- ② 토큰 ID 목록 -->
  <circle cx="72" cy="296" r="12" class="num"/><text x="72" y="301" text-anchor="middle" class="numt">2</text>
  <text x="92" y="302" class="lbl">토큰 ID 목록 (5,145개)</text>
  <g>
    <rect x="60"  y="316" width="62" height="34" class="cell"/><text x="91"  y="338" text-anchor="middle" class="mono">40</text>
    <rect x="122" y="316" width="62" height="34" class="cell"/><text x="153" y="338" text-anchor="middle" class="mono">367</text>
    <rect x="184" y="316" width="62" height="34" class="cell"/><text x="215" y="338" text-anchor="middle" class="mono">2885</text>
    <rect x="246" y="316" width="62" height="34" class="cell"/><text x="277" y="338" text-anchor="middle" class="mono">1464</text>
    <rect x="308" y="316" width="62" height="34" class="cell"/><text x="339" y="338" text-anchor="middle" class="mono">1807</text>
    <text x="384" y="338" class="t">…</text>
  </g>
  <line x1="230" y1="350" x2="230" y2="392" class="flow" marker-end="url(#arr)"/>
  <text x="244" y="376" class="note">슬라이딩 윈도 · 데이터 로더</text>

  <!-- ③ 배치 -->
  <circle cx="72" cy="414" r="12" class="num"/><text x="72" y="419" text-anchor="middle" class="numt">3</text>
  <text x="92" y="420" class="lbl">배치 = 토큰 ID 텐서 [8, 4]</text>
  <g>
    <rect x="60"  y="432" width="75" height="34" class="hi"/><text x="97"  y="454" text-anchor="middle" class="mono hit">40</text>
    <rect x="135" y="432" width="75" height="34" class="cell"/><text x="172" y="454" text-anchor="middle" class="mono">367</text>
    <rect x="210" y="432" width="75" height="34" class="cell"/><text x="247" y="454" text-anchor="middle" class="mono">2885</text>
    <rect x="285" y="432" width="75" height="34" class="cell"/><text x="322" y="454" text-anchor="middle" class="mono">1464</text>
    <rect x="60"  y="466" width="75" height="34" class="cell"/><text x="97"  y="488" text-anchor="middle" class="mono">1807</text>
    <rect x="135" y="466" width="75" height="34" class="cell"/><text x="172" y="488" text-anchor="middle" class="mono">3619</text>
    <rect x="210" y="466" width="75" height="34" class="cell"/><text x="247" y="488" text-anchor="middle" class="mono">402</text>
    <rect x="285" y="466" width="75" height="34" class="cell"/><text x="322" y="488" text-anchor="middle" class="mono">271</text>
  </g>
  <text x="210" y="528" text-anchor="middle" class="t">⋮  8행</text>
  <text x="60" y="560" class="note">행 = 배치 안 순서 · 열 = 행 안 순번</text>
  <text x="60" y="582" class="note">자리의 값 = 토큰 ID</text>

  <!-- ③ → ④ 룩업 화살표 -->
  <path d="M360,449 H440 V417 H516" class="flow" marker-end="url(#arr)"/>
  <text x="366" y="476" class="note" fill="#0f766e">룩업: 값 40 → 40번 행</text>

  <!-- ④ 토큰 임베딩 층 -->
  <circle cx="532" cy="296" r="12" class="num"/><text x="532" y="301" text-anchor="middle" class="numt">4</text>
  <text x="552" y="302" class="lbl">토큰 임베딩 층 [50257, 256]</text>
  <rect x="520" y="316" width="340" height="30" class="row"/>
  <text x="566" y="336" text-anchor="end" class="mono">0</text><text x="584" y="336" class="mono">v1 v2 … v256</text>
  <rect x="520" y="350" width="340" height="30" class="row"/>
  <text x="566" y="370" text-anchor="end" class="mono">1</text><text x="584" y="370" class="mono">v1 v2 … v256</text>
  <text x="690" y="396" text-anchor="middle" class="t">⋮</text>
  <rect x="520" y="402" width="340" height="32" rx="2" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
  <text x="566" y="423" text-anchor="end" class="mono" font-weight="700">40</text><text x="584" y="423" class="mono" font-weight="700">v1 v2 … v256</text>
  <text x="690" y="454" text-anchor="middle" class="t">⋮</text>
  <rect x="520" y="462" width="340" height="30" class="row"/>
  <text x="566" y="482" text-anchor="end" class="mono">50256</text><text x="584" y="482" class="mono">v1 v2 … v256</text>
  <text x="520" y="514" class="note">행 번호 = 토큰 ID — 값 40 → 40번 행</text>
  <line x1="690" y1="524" x2="690" y2="562" class="flow" marker-end="url(#arr)"/>

  <!-- 토큰 임베딩 결과 -->
  <text x="520" y="588" class="lbl" font-size="16">토큰 임베딩 [8, 4, 256]</text>
  <g>
    <rect x="520" y="602" width="80" height="34" class="hi"/><text x="560" y="624" text-anchor="middle" class="mono hit">[256]</text>
    <rect x="600" y="602" width="80" height="34" class="cell"/><text x="640" y="624" text-anchor="middle" class="mono">[256]</text>
    <rect x="680" y="602" width="80" height="34" class="cell"/><text x="720" y="624" text-anchor="middle" class="mono">[256]</text>
    <rect x="760" y="602" width="80" height="34" class="cell"/><text x="800" y="624" text-anchor="middle" class="mono">[256]</text>
    <rect x="520" y="636" width="80" height="34" class="cell"/><text x="560" y="658" text-anchor="middle" class="mono">[256]</text>
    <rect x="600" y="636" width="80" height="34" class="cell"/><text x="640" y="658" text-anchor="middle" class="mono">[256]</text>
    <rect x="680" y="636" width="80" height="34" class="cell"/><text x="720" y="658" text-anchor="middle" class="mono">[256]</text>
    <rect x="760" y="636" width="80" height="34" class="cell"/><text x="800" y="658" text-anchor="middle" class="mono">[256]</text>
  </g>
  <text x="680" y="696" text-anchor="middle" class="t">⋮  8행</text>
  <text x="520" y="724" class="note">자리마다 정수 하나 → 값 256개인 벡터 하나</text>

  <!-- + 기호 -->
  <text x="886" y="636" text-anchor="middle" fill="#0f766e" font-size="34" font-weight="700">+</text>

  <!-- ⑤ 위치 임베딩 층 -->
  <circle cx="942" cy="296" r="12" class="num"/><text x="942" y="301" text-anchor="middle" class="numt">5</text>
  <text x="962" y="302" class="lbl">위치 임베딩 층 [4, 256]</text>
  <rect x="930" y="316" width="320" height="30" class="row"/>
  <text x="954" y="336" text-anchor="end" class="mono">0</text><text x="972" y="336" class="mono">p1 p2 … p256</text>
  <rect x="930" y="350" width="320" height="30" class="row"/>
  <text x="954" y="370" text-anchor="end" class="mono">1</text><text x="972" y="370" class="mono">p1 p2 … p256</text>
  <rect x="930" y="384" width="320" height="30" class="row"/>
  <text x="954" y="404" text-anchor="end" class="mono">2</text><text x="972" y="404" class="mono">p1 p2 … p256</text>
  <rect x="930" y="418" width="320" height="30" class="row"/>
  <text x="954" y="438" text-anchor="end" class="mono">3</text><text x="972" y="438" class="mono">p1 p2 … p256</text>
  <text x="930" y="476" class="note">행 번호 = 순번 (컨텍스트 길이 4)</text>
  <text x="930" y="498" class="note">순번마다 벡터 하나 — 배치의 8행이 함께 사용</text>
  <line x1="1090" y1="524" x2="1090" y2="562" class="flow" marker-end="url(#arr)"/>

  <!-- 위치 임베딩 결과 -->
  <text x="930" y="588" class="lbl" font-size="16">위치 임베딩 [4, 256]</text>
  <g>
    <rect x="930"  y="602" width="78" height="34" class="cell"/><text x="969"  y="624" text-anchor="middle" class="mono">p(0)</text>
    <rect x="1008" y="602" width="78" height="34" class="cell"/><text x="1047" y="624" text-anchor="middle" class="mono">p(1)</text>
    <rect x="1086" y="602" width="78" height="34" class="cell"/><text x="1125" y="624" text-anchor="middle" class="mono">p(2)</text>
    <rect x="1164" y="602" width="78" height="34" class="cell"/><text x="1203" y="624" text-anchor="middle" class="mono">p(3)</text>
  </g>
  <text x="930" y="664" class="note">행이 하나뿐 — 8행 모두에 같은 것을 더함</text>
  <text x="930" y="686" class="note">(브로드캐스팅)</text>

  <!-- → ⑥ -->
  <line x1="1246" y1="619" x2="1294" y2="619" class="flow" marker-end="url(#arr)"/>

  <!-- ⑥ 입력 임베딩 -->
  <circle cx="1312" cy="296" r="12" class="num"/><text x="1312" y="301" text-anchor="middle" class="numt">6</text>
  <text x="1332" y="302" class="lbl">입력 임베딩 [8, 4, 256]</text>
  <rect x="1300" y="316" width="260" height="420" rx="14" fill="#4f46e5"/>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="1316" y="338" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1342" y="358" fill="#3730a3">t+p</text>
    <rect x="1374" y="338" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1400" y="358" fill="#3730a3">t+p</text>
    <rect x="1432" y="338" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1458" y="358" fill="#3730a3">t+p</text>
    <rect x="1490" y="338" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1516" y="358" fill="#3730a3">t+p</text>
    <rect x="1316" y="374" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1342" y="394" fill="#3730a3">t+p</text>
    <rect x="1374" y="374" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1400" y="394" fill="#3730a3">t+p</text>
    <rect x="1432" y="374" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1458" y="394" fill="#3730a3">t+p</text>
    <rect x="1490" y="374" width="52" height="30" rx="4" fill="#e0e7ff"/><text x="1516" y="394" fill="#3730a3">t+p</text>
  </g>
  <text x="1430" y="436" text-anchor="middle" fill="#e0e7ff" font-size="15">⋮  8행</text>
  <text x="1430" y="510" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">토큰 임베딩과 크기 같음</text>
  <text x="1430" y="536" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">각 벡터에 위치 정보만 더해짐</text>
  <text x="1430" y="592" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">= 모델에 들어가는</text>
  <text x="1430" y="618" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">최종 입력</text>
  <text x="1430" y="690" text-anchor="middle" fill="#c7d2fe" font-size="13">t = 토큰 임베딩, p = 위치 임베딩</text>

  <!-- 하단 요약 -->
  <line x1="60" y1="772" x2="1540" y2="772" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="60" y="806" fill="#1f2937" font-size="17">텍스트 → 토큰 ID → 배치 → 토큰 임베딩 + 위치 임베딩 = 입력 임베딩 <tspan fill="#6b7280" font-size="14">(숫자는 ch03_colab.ipynb 실행값)</tspan></text>
  <text x="60" y="852" class="note">Build a Large Language Model — 3. 데이터 샘플링과 임베딩 · 강의 슬라이드를 참고해 다시 그림</text>
</svg>
